# mysql-target：MySQL 专家包的被管实例（M4 D13；00 §5"可扩展到 MySQL"）。单实例，内存上限 512Mi（kind 上已经有 3 个 ES 节点）。
# 账号由 initdb 脚本创建，密码来自 Secret（kind-up.sh 首次运行时随机生成）：
#   - sentinel-ro：只读（01 §6）：PROCESS + performance_schema 的 SELECT；读不到业务表
#   - sentinel-exec：执行器（ADR-005）：只有 SYSTEM_VARIABLES_ADMIN（动作目录只会 SET GLOBAL max_connections）
#   - root：只给故障脚本（deploy/chaos/mysql/）用，和 ES 的 elastic 超级用户一样
apiVersion: v1
kind: ConfigMap
metadata: { name: mysql-target-init, namespace: targets }
data:
  01-users.sh: |
    #!/bin/bash
    set -e
    mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    CREATE USER IF NOT EXISTS 'sentinel-ro'@'%' IDENTIFIED BY '${RO_PASSWORD}';
    GRANT PROCESS ON *.* TO 'sentinel-ro'@'%';
    GRANT SELECT ON performance_schema.* TO 'sentinel-ro'@'%';
    CREATE USER IF NOT EXISTS 'sentinel-exec'@'%' IDENTIFIED BY '${EXEC_PASSWORD}';
    GRANT SYSTEM_VARIABLES_ADMIN ON *.* TO 'sentinel-exec'@'%';
    CREATE DATABASE IF NOT EXISTS shop;
    CREATE TABLE IF NOT EXISTS shop.orders (id INT PRIMARY KEY AUTO_INCREMENT, status VARCHAR(16), amount INT);
    INSERT INTO shop.orders (status, amount) VALUES ('paid', 10), ('paid', 20), ('new', 30);
    SET PERSIST max_connections = 60;
    SQL
---
apiVersion: v1
kind: Service
metadata: { name: mysql-target, namespace: targets }
spec:
  selector: { app: mysql-target }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql-target, namespace: targets }
spec:
  serviceName: mysql-target
  replicas: 1
  selector: { matchLabels: { app: mysql-target } }
  template:
    metadata: { labels: { app: mysql-target } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.3
          args: ["--performance-schema=ON", "--innodb-buffer-pool-size=64M"]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: mysql-target-auth, key: root } } }
            - { name: RO_PASSWORD, valueFrom: { secretKeyRef: { name: mysql-target-auth, key: ro } } }
            - { name: EXEC_PASSWORD, valueFrom: { secretKeyRef: { name: mysql-target-auth, key: exec } } }
          ports: [{ containerPort: 3306 }]
          readinessProbe:
            exec: { command: [sh, -c, 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'] }
            periodSeconds: 5
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: init, configMap: { name: mysql-target-init } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
