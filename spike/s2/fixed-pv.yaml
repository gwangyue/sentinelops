# S2：固定大小的 local PV（loop 设备上的 3G ext4），让磁盘水位故障只影响这块盘，不碰 Docker VM 的共享盘
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: es-fixed }
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: esdata-sentinel-worker-0 }
spec:
  capacity: { storage: 3Gi }
  accessModes: [ReadWriteOnce]
  storageClassName: es-fixed
  persistentVolumeReclaimPolicy: Retain
  local: { path: /mnt/esdata-0 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [sentinel-worker] }]
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: esdata-sentinel-worker-1 }
spec:
  capacity: { storage: 3Gi }
  accessModes: [ReadWriteOnce]
  storageClassName: es-fixed
  persistentVolumeReclaimPolicy: Retain
  local: { path: /mnt/esdata-1 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [sentinel-worker] }]
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: esdata-sentinel-worker2-0 }
spec:
  capacity: { storage: 3Gi }
  accessModes: [ReadWriteOnce]
  storageClassName: es-fixed
  persistentVolumeReclaimPolicy: Retain
  local: { path: /mnt/esdata-0 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [sentinel-worker2] }]
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: esdata-sentinel-worker2-1 }
spec:
  capacity: { storage: 3Gi }
  accessModes: [ReadWriteOnce]
  storageClassName: es-fixed
  persistentVolumeReclaimPolicy: Retain
  local: { path: /mnt/esdata-1 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [sentinel-worker2] }]
