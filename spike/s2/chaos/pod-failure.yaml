# 节点宕机：把 data-2 的容器换成 pause，ES 节点离开集群。duration 兜底，防止撤销失败时一直挂着
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata: { name: spike-pod-failure, namespace: targets }
spec:
  action: pod-failure
  mode: one
  duration: "10m"
  selector:
    namespaces: [targets]
    labelSelectors: { statefulset.kubernetes.io/pod-name: es-target-es-data-2 }
