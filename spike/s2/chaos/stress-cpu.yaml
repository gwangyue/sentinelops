# 热点节点：在 data-2 的容器里压 CPU（4 核 Docker VM，2 个 worker × 100% 负载）
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata: { name: spike-stress-cpu, namespace: targets }
spec:
  mode: one
  duration: "10m"
  selector:
    namespaces: [targets]
    labelSelectors: { statefulset.kubernetes.io/pod-name: es-target-es-data-2 }
  containerNames: [elasticsearch]
  stressors:
    cpu: { workers: 2, load: 100 }
