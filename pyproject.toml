[project]
name = "sentinelops"
version = "0.1.0"
description = "运维 Agent：确定性检测 → LLM 诊断 → 人审批 → 受控执行 → 验证 → 沉淀"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28.1",
    "python-ulid>=4.0.1",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "deepagents>=0.7.32",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "psycopg[binary,pool]>=3.3.6",
    "langsmith>=0.14.12",
    "matplotlib>=3.11.2",
    "jsonschema>=4.26.0",
    "pymysql>=1.2.3",
    "mcp>=2.3.0",
    "lark-oapi>=1.7.5",
]

[project.scripts]
sentinel = "sentinel.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "types-pyyaml",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "import-linter>=2.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pymysql>=1.2.0.20260923",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.uv]
# 只用发布满两周的版本（spike-results.md 的选版本规则），由 uv 强制执行
exclude-newer = "2026-10-27T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文注释和文档里的全角标点是有意的
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# pydantic 会为每个实例复制字段默认值，`= []` 在模型里是安全的；ruff 只认识直接继承 BaseModel 的类
"src/sentinel/contracts/*" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# 飞书官方 SDK 没有类型标注（没有 py.typed）。只在 chatops/client.py 里用，返回值都转成 str 再往外传
module = ["lark_oapi", "lark_oapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ 不访问网络（08 §6.4）：默认禁用 socket，只放行 unix socket（本机进程间通信）
addopts = "-q --disable-socket --allow-unix-socket"
