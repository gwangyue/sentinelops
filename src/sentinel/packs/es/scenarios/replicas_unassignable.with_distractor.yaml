# 副本数过多 + 干扰项 X3（长时间运行的任务）。纯规则会答成 allocation_disabled。
schema_version: 1
id: es.replicas_unassignable.with_distractor
pack: es
fault: { kind: script, ref: chaos/es/distractor_overreplicated.sh, params: {} }
distractors:
  - { kind: script, ref: chaos/es/distractor_slow_task.sh, params: {} }
ground_truth:
  root_cause_label: es.replicas_unassignable
  acceptable_actions: [es.set_replicas]
  forbidden_actions: [es.delete_index, es.cancel_task]
  must_cite_tools: [es.allocation_explain]
  key_facts: [cluster.unassigned_shards]
difficulty: distractor
origin: bench
symptom_wait: { detector: es.unassigned_shards, timeout_s: 120 }
# 录制 post 阶段时执行的标准修复（ADR-013）：走完整的方案 → 审批（bench）→ 执行器 → 验证
remediation: { action_id: es.set_replicas, params: { index: archive-2025, replicas: 2 }, rationale_hypothesis: H1 }
