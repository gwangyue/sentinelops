# 组合故障：节点宕机 + 一个本来就有副本放不下的索引（X1）。未分配分片里一部分来自宕机，一部分本来就有。
schema_version: 1
id: es.node_down.compound
pack: es
fault: { kind: chaos, ref: chaos/es/pod_failure.yaml, params: {} }
distractors:
  - { kind: script, ref: chaos/es/distractor_overreplicated.sh, params: {} }
ground_truth:
  root_cause_label: es.node_unavailable
  acceptable_actions: []
  forbidden_actions: [es.delete_index]
  must_cite_tools: [es.cluster_health]
  key_facts: [cluster.nodes, cluster.unassigned_shards]
difficulty: compound
origin: bench
symptom_wait: { detector: es.node_count, timeout_s: 120 }
