# ES 专家包清单（03 §3.1）。新增一个领域 = 新增一份这样的清单 + 它引用的代码。
schema_version: 1
pack: es
version: 0.1.0
supports: ">=9.0,<10"            # S1 实测：ECK 3.5.0 部署 ES 9.5.3
connection:
  kind: elasticsearch
  read_credential: es-readonly   # 运行时解析为环境变量 SENTINEL_CRED_ES_READONLY_{URL,USER,PASSWORD}
  # write_credential 在 M3 执行器上线时加
detectors:
  - { id: es.unassigned_shards, entry: "sentinel.packs.es.detectors.unassigned:detect", interval: 15m }
  - { id: es.disk_watermark,    entry: "sentinel.packs.es.detectors.disk:detect",       interval: 15m }
  - { id: es.node_count,        entry: "sentinel.packs.es.detectors.nodes:detect",      interval: 15m }
  - { id: es.shard_limit,       entry: "sentinel.packs.es.detectors.shards:detect",     interval: 15m }
tools:
  # output_budget_tokens 是摘要进入上下文前的上限（03 §3.1 约束：必填）
  - { id: es.cluster_health,     entry: "sentinel.packs.es.tools.cluster:health",            mcp_export: true,  output_budget_tokens: 150 }
  - { id: es.cluster_settings,   entry: "sentinel.packs.es.tools.cluster:settings",          mcp_export: true,  output_budget_tokens: 400 }
  - { id: es.cat_allocation,     entry: "sentinel.packs.es.tools.allocation:cat_allocation", mcp_export: true,  output_budget_tokens: 400 }
  - { id: es.cat_shards,         entry: "sentinel.packs.es.tools.allocation:cat_shards",     mcp_export: true,  output_budget_tokens: 800 }
  - { id: es.allocation_explain, entry: "sentinel.packs.es.tools.allocation:allocation_explain", mcp_export: true, output_budget_tokens: 800 }
  - { id: es.nodes_stats,        entry: "sentinel.packs.es.tools.nodes:nodes_stats",         mcp_export: true,  output_budget_tokens: 600 }
  - { id: es.hot_threads,        entry: "sentinel.packs.es.tools.nodes:hot_threads",         mcp_export: false, output_budget_tokens: 600 }  # 可能含敏感内容
  - { id: es.index_settings,     entry: "sentinel.packs.es.tools.indices:index_settings",    mcp_export: true,  output_budget_tokens: 600 }
  - { id: es.cat_indices,        entry: "sentinel.packs.es.tools.indices:cat_indices",       mcp_export: true,  output_budget_tokens: 600 }
  - { id: es.cat_recovery,       entry: "sentinel.packs.es.tools.indices:cat_recovery",      mcp_export: true,  output_budget_tokens: 400 }
  - { id: es.tasks,              entry: "sentinel.packs.es.tools.tasks:tasks",               mcp_export: false, output_budget_tokens: 400 }  # 任务描述可能含用户内容
actions: []                      # 动作目录在 M3 加
fact_builders:
  - entry: "sentinel.packs.es.facts:cluster_facts"
knowledge: []                    # runbook 在 M2 D5 加
scenarios: scenarios/
