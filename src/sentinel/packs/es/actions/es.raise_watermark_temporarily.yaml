# 临时提高磁盘水位（03 §4.2）：低水位和高水位一起提高到 high_pct，让磁盘吃紧的节点重新能接收分片。
# 决定能不能放新分片的是低水位（M3 D11 实测）；只能在当前低水位和洪水位之间；回滚把 4 项恢复原值。
schema_version: 1
id: es.raise_watermark_temporarily
pack: es
risk: medium
reversible: true
params_schema:
  type: object
  properties:
    high_pct: { type: number, minimum: 86, maximum: 94, description: "低水位和高水位一起提高到的百分比：要高于磁盘吃紧节点的使用率，低于洪水位（默认 95）" }
  required: [high_pct]
  additionalProperties: false
preconditions: ["sentinel.packs.es.actions.es_actions:raise_watermark_precheck"]
dry_run: "sentinel.packs.es.actions.es_actions:raise_watermark_dry_run"
execute: "sentinel.packs.es.actions.es_actions:raise_watermark_execute"
rollback: "sentinel.packs.es.actions.es_actions:raise_watermark_rollback"
verify: { predicate: "sentinel.packs.es.actions.es_actions:green_verify", timeout_s: 300, poll_interval_s: 10 }
requires_approval: true
max_blast_radius: { settings_changed: 1 }
