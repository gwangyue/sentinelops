# 治理的数值（07 §6.1 预算；§8 周报）。【待定】的初始值，跑一段时间之后再调。
version: 1
budget: { daily_usd: 2.0 }          # 每天的模型费用上限（作品项目）；周报的预算使用率 = 本周费用 / (7 × daily_usd)
report:
  approval_reject_rate_alert: 0.5   # 某个动作的审批拒绝率超过这个值（且至少 2 次审批）就列进"需要你决定的事"
# MCP 只读服务（02 §8）：目标属于哪个专家包；每个调用方能访问哪些目标（第一版的调用方身份取自 --as）
mcp:
  targets: { es-target: es, mysql-target: mysql }
  callers: { claude: [es-target, mysql-target], workbuddy: [es-target] }
